<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>임금님 다마고치</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cdbcf2">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="임금님 다마고치">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --pink1:#ffe6f2; --pink2:#f7a9cf; --pink3:#e27fb2; --pink4:#b8558a;
  --mint1:#c9fbe9; --mint2:#7fe0c3; --mint3:#3fbf9c; --mint4:#22876d;
  --ink:#3b2a46; --cream:#fff7e8;
  --font:'Galmuri11','Galmuri9','DungGeunMo',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); color:var(--ink);
  background:#fde9f3;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.75) 0 2px, transparent 3px),
    linear-gradient(160deg,#ffeaf4,#e9e4ff 60%,#dff8f0);
  background-size:30px 30px,100% 100%;
  background-position:center; background-attachment:fixed;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden; user-select:none; -webkit-user-select:none;
}
body.custom-bg{background-size:cover;background-repeat:no-repeat;background-position:center}
body.pixel-bg{image-rendering:pixelated}
.app{width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 0 24px}

/* ---------- egg (flat) ---------- */
.egg-wrap{--body:#f9b8d8;--bodyB:#e48fbb;--acc:#9eebd2;--accB:#52b896;--dot:#f7a9cf;--heart:#ff6fae;--glow:rgba(255,200,228,.95);position:relative;width:350px;height:470px;margin-top:6px;filter:saturate(.92) brightness(1.04) drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 4px rgba(255,255,255,.9))}
.knob{position:absolute;right:-8px;top:78px;width:44px;height:44px;border-radius:50%;background:var(--acc);border:3px solid var(--accB);transform:rotate(20deg)}
.knob::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--dot);border:3px solid var(--accB)}
.egg{position:absolute;inset:0;overflow:hidden;border-radius:50% 50% 47% 47% / 57% 57% 43% 43%;background:var(--body);border:4px solid var(--bodyB);box-shadow:inset 0 0 26px 6px rgba(255,255,255,.55)}
.egg::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px);mix-blend-mode:screen;box-shadow:inset 0 0 18px rgba(255,255,255,.6)}
.crown{position:absolute;left:0;right:0;top:0;height:132px;background:var(--acc);
  clip-path:polygon(0 0,100% 0,100% 62%,92% 78%,84% 60%,75% 82%,66% 62%,57% 84%,50% 64%,43% 84%,34% 62%,25% 82%,16% 60%,8% 78%,0 62%)}
.heart{position:absolute;color:var(--heart);font-size:22px;transform:rotate(-15deg)}
.bezel{position:absolute;left:50%;top:100px;transform:translateX(-50%);width:276px;height:244px;border-radius:24px;background:var(--acc);border:3px solid var(--accB);box-shadow:0 0 10px rgba(255,255,255,.8),inset 0 0 8px rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center}
.bezel::before{content:"";position:absolute;inset:4px;border-radius:19px;background:#2b2140}
.screen{position:relative;width:256px;height:224px;border-radius:6px;overflow:hidden;background:#000}
.screen canvas{position:absolute;inset:0;width:256px;height:224px;image-rendering:pixelated;image-rendering:crisp-edges}
#glow{filter:blur(3px) brightness(1.1) saturate(1.2);opacity:.32;mix-blend-mode:screen}
.lcd-grid{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 2px);
  mix-blend-mode:overlay}

/* menu & dialog (in-screen UI) */
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:196px;max-height:168px;overflow-y:auto;scrollbar-width:none;
  background:var(--cream);border:3px solid var(--ink);border-radius:4px;
  box-shadow:3px 3px 0 rgba(59,42,70,.55),inset 0 0 0 2px #ffd6e8;padding:6px 6px 7px;
  font-size:12px;line-height:16px;display:none;image-rendering:pixelated}
#menu .ttl{display:flex;justify-content:space-between;font-size:11px;background:#ff8fbf;color:#fff;margin:-6px -6px 5px;padding:2px 6px;border-bottom:3px solid var(--ink);letter-spacing:1px}
#menu .it{display:flex;align-items:center;gap:3px;padding:0 2px;white-space:nowrap}
#menu .it .cur{width:10px;color:#ff4f95;visibility:hidden}
#menu .it.sel{background:#ffe1ee}
#menu .it.sel .cur{visibility:visible;animation:blink .6s steps(2) infinite}
#menu .it.off{color:#b8a8bd}
#menu .inv{display:grid;grid-template-columns:repeat(4,34px);gap:4px;justify-content:center;padding:2px 4px 2px}
#menu .cell{aspect-ratio:1;border:2px solid #3b2a46;background:#fff6fb;display:flex;align-items:center;justify-content:center}
#menu .cell.sel{background:#ffe1ee;border-color:#ff4f95;box-shadow:0 0 0 1px #ff4f95}
#menu .cell img{width:80%;image-rendering:pixelated}
#menu .iname{text-align:center;font-size:10px;color:#7d6a86;min-height:12px}
#menu .it .tag{margin-left:auto;font-size:9px;color:#a98fb5;border:1px solid #d9c6e2;padding:0 2px;line-height:11px}
@keyframes blink{50%{opacity:0}}
#dialog{position:absolute;left:8px;right:8px;bottom:26px;background:var(--cream);border:3px solid var(--ink);border-radius:4px;
  box-shadow:3px 3px 0 rgba(59,42,70,.5);padding:5px 8px 6px;font-size:12px;line-height:16px;min-height:38px;display:none}
#dialog .nm{position:absolute;top:-12px;left:6px;background:#7fe0c3;border:2px solid var(--ink);font-size:10px;line-height:12px;padding:0 5px;color:var(--ink)}
#menu .srow{display:flex;align-items:center;gap:6px;margin-top:2px}#menu .sn{width:40px;font-size:11px;white-space:nowrap}#menu .bar{display:flex;gap:1px}#menu .bar i{display:block;width:8px;height:8px;background:#eadcf0;border:1px solid #3b2a46}#menu .st{font-size:9px;line-height:11px;color:#8a6f98;margin:0 0 3px 46px}#menu .gold{margin-top:5px;border-top:2px dashed #e3c9dc;padding-top:4px}#menu .gv{color:#c9862a}#dialog .nx{position:absolute;right:6px;bottom:2px;font-size:9px;animation:blink .7s steps(2) infinite}

/* buttons (flat) */
.btns{position:absolute;left:0;right:0;top:370px;display:flex;justify-content:center;gap:30px}
.btn{width:52px;height:52px;border-radius:50%;cursor:pointer;background:var(--acc);border:4px solid var(--accB);padding:0;box-shadow:0 0 10px rgba(255,255,255,.85),inset 0 0 8px rgba(255,255,255,.75)}
.btn.mid{margin-top:12px}
.btn:active,.btn.down{filter:brightness(.9)}

/* below device */
.addbg{margin-top:22px;font-family:var(--font);font-size:13px;color:var(--ink);background:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:7px 18px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.addbg:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.test{margin-top:16px;width:300px;text-align:center;background:rgba(255,255,255,.75);border:2px dashed #c9a3d8;border-radius:12px;padding:10px 12px;font-size:11px}
.test b{display:block;margin-bottom:6px;color:#a35a8a}
.test .row{display:flex;justify-content:center;gap:8px}
.test button{font-family:var(--font);font-size:11px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer}
.test button.on{background:#ffd3e6}
.test .hint{margin-top:8px;color:#8a7395;line-height:15px}
.bgbtns{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.bgbtns .addbg{margin-top:0;font-size:12px;padding:7px 12px}
.addbg.cap{margin-top:10px}
.caprow{display:flex;gap:8px;justify-content:center}
.minput{display:block;width:100%;box-sizing:border-box;margin:6px 0 2px;font-family:var(--font);font-size:13px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 8px;resize:none}
.mcount{font-size:11px;color:#a98fb5;text-align:right;min-height:14px}
.mcode{font-size:26px;letter-spacing:6px;color:var(--ink);margin:4px 0}
.glog{text-align:left;max-height:50vh;overflow-y:auto;font-size:12px;line-height:1.6;color:var(--ink)}
.glog .gt{color:#a35a8a;font-size:11px;margin-right:6px}
.glog .ge{padding:4px 2px;border-bottom:1px dashed #e3c6da;white-space:pre-line}
.glog h4{margin:8px 0 2px;font-size:12px;color:#a35a8a}
.glog ul{margin:0;padding-left:16px}
.glog .ga{padding-left:12px;color:#7d6a86}
.glog .gar{color:#ff7fb0;font-weight:bold}
.test .row+b{margin-top:12px}
.test .sw{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;margin-right:4px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:rgba(59,42,70,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.mbox{background:#fff7fb;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:14px;width:min(92vw,380px);text-align:center}
.mt{font-size:14px;margin-bottom:10px;color:#a35a8a}
#capImg{width:100%;aspect-ratio:1/1;border:3px solid var(--ink);border-radius:8px;display:block;background:#fff}
.mrow{display:flex;gap:8px;justify-content:center;margin-top:12px}
.mrow .addbg{margin-top:0;font-size:12px;padding:7px 14px}
.addbg.ghost{background:#f3e9f5}
.bggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgopt{aspect-ratio:9/14;border:3px solid var(--ink);border-radius:10px;background-size:cover;background-position:center;image-rendering:pixelated;cursor:pointer;position:relative;padding:0;font-family:var(--font)}
.bgopt.on{outline:3px solid #ff8fbf;outline-offset:2px}
.egg-scale .btn.dial{width:48px;height:48px}
.bkhint{font-size:11px;line-height:16px;color:#8a7395;margin-bottom:4px}
.mcol{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin-top:10px}
.mcol .addbg{margin-top:0;font-size:12px;padding:8px 14px}
#menu::-webkit-scrollbar{display:none}
#clock{position:absolute;top:27px;left:5px;font-size:11px;line-height:13px;padding:1px 5px;background:var(--cream);color:#6b4a7a;border:2px solid var(--ink);border-radius:3px;box-shadow:2px 2px 0 rgba(59,42,70,.45);z-index:2}
#noteText{white-space:pre-line}
#broTimer{text-align:center;position:absolute;top:27px;right:5px;display:none;font-size:11px;line-height:13px;padding:1px 5px;background:var(--cream);color:#6b4a7a;border:2px solid var(--ink);border-radius:3px;box-shadow:2px 2px 0 rgba(59,42,70,.45);z-index:2}
#menu .ttl{position:sticky;top:-6px;z-index:1}
.copy{margin-top:22px;font-size:11px;color:#a98fb5;letter-spacing:1px;text-align:center}
.bgopt span{position:absolute;left:0;right:0;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);margin:0 6px;border-radius:6px;color:var(--ink)}

html,body{height:auto;min-height:100%}
.app>*{flex-shrink:0}
.egg-holder{position:relative;width:390px;height:520px;margin-top:4px}
.egg-scale{position:absolute;left:0;top:0;width:390px;height:520px;transform-origin:0 0}
#shell{position:absolute;left:0;top:0;width:390px;height:520px;--glow:rgba(255,200,228,.95);filter:saturate(.95) brightness(1.04) drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 4px rgba(255,255,255,.9))}
.egg-scale .egg-wrap{position:absolute;left:20px;top:25px;width:350px;height:470px;margin:0;filter:none}
.egg-scale .screen{position:absolute;left:47px;top:110px}
.egg-scale .btn{position:absolute;width:40px;height:40px;border-radius:50%;background:transparent;border:none;box-shadow:none;padding:0;cursor:pointer;margin:0}
.egg-scale .btn.down,.egg-scale .btn:active{background:rgba(60,20,40,.14);filter:none}
.egg-scale .btn:not(.dial){width:52px;height:52px;margin:-6px 0 0 -6px}   /* 누르는 범위를 넓게 (가운데 그대로) */
.btn{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}   /* 누른 채 손가락이 살짝 움직여도 스크롤로 취소되지 않게 */
.test button[data-theme]{min-width:44px}
.test .row{flex-wrap:wrap}.test{width:330px}
#menu .it{line-height:15px}
#menu .sep{border-top:2px dashed #e3c9dc;margin:4px 0 3px}
</style>
</head>
<body>
<div class="app">
  <div class="egg-holder" id="eggHolder"><div class="egg-scale" id="eggScale">
    <canvas id="shell"></canvas>
    <div class="egg-wrap">
      <div class="screen" id="screen">
          <canvas id="lcd" width="128" height="112"></canvas>
          <canvas id="glow" width="128" height="112"></canvas>
          <div class="lcd-grid"></div>
          <div id="clock"></div>
          <div id="menu"></div>
          <div id="dialog"><div class="nm">임금님</div><div id="dtext"></div><div class="nx">▼</div></div>
        </div>
      <button class="btn" id="bA" style="left:73px;top:376px" aria-label="관심"></button>
      <button class="btn" id="bB" style="left:155px;top:388px" aria-label="기능"></button>
      <button class="btn" id="bC" style="left:237px;top:376px" aria-label="다음 항목"></button>
    </div>
  </div></div>

  <div class="bgbtns"><button class="addbg" id="addbg">+ add background</button><button class="addbg" id="chgbg">⇄ change background</button></div>
  <div class="caprow"><button class="addbg cap" id="capbtn">📷 capture</button></div>
  <input type="file" id="bgfile" accept="image/*" hidden>

  <div class="test">
    <b>✦ 옷 갈아입기</b>
    <div class="row">
      <button data-outfit="basic" class="on">기본</button>
      <button data-outfit="uniform">제복</button>
    </div>
    <b>✦ 테마 변경하기</b>
    <div class="row">
      <button data-theme="1" class="on">1</button>
      <button data-theme="2">2</button>
      <button data-theme="3">3</button>
      <button data-theme="4">4</button>
      <button data-theme="5">5</button>
    </div>
  </div>
  <div class="copy">© 나나곰 쿠키</div>
  <div class="modal" id="bgModal"><div class="mbox"><div class="mt">배경 바꾸기</div><div class="bggrid" id="bgGrid"></div></div></div>
  <div class="modal" id="capModal"><div class="mbox"><div class="mt">📷 capture</div><img id="capImg" alt="capture"><div class="mrow"><button class="addbg" id="capSave">이미지로 저장하기</button><button class="addbg ghost" id="capClose">닫기</button></div></div></div>
</div>

/* ================= sound ================= */
let AC=null;
function beep(f=880,d=.06,type='square',v=.05){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}
}

/* ================= pixel helpers ================= */
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0);}
function bitmap(c,rows,x,y,col){c.fillStyle=col;rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')c.fillRect(x+i,y+j,1,1);});}
function pbitmap(c,rows,pal,x,y){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const p=pal[r[i]];if(p){c.fillStyle=p;c.fillRect(x+i,y+j,1,1);}}});}

function inRoom(m){return !m.room||(Array.isArray(m.room)?m.room.includes(st.room):m.room===st.room);}
function currentIcon(){
  if(st.menu==='act'){const m=menuItems()[st.cur];return m?m.id:'';}
  if(st.menu==='root') return {act:'',status:'status',move:'move'}[ROOT[st.cur].id];
  if(['status','shop','acc'].includes(st.menu)) return 'status';
  if(st.menu==='move') return 'move';
  return {pet:'pet',eat:'wine',sleep:'sleep',listen:st.listenKind,talk:st.talkIcon}[st.mode]||'';
}
function drawBars(t){
  R(ctx,0,0,W,ROOM_Y,'#fff4f9');R(ctx,0,ROOM_Y-1,W,1,'#e8b9d2');
  R(ctx,0,ROOM_Y+ROOM_H,W,H-ROOM_Y-ROOM_H,'#fff4f9');R(ctx,0,ROOM_Y+ROOM_H,W,1,'#e8b9d2');
  const hl=currentIcon();
  const draw=(arr,y,x0,gap)=>arr.forEach((id,i)=>{
    const x=x0+i*gap;
    const blink=!st.menu && id===hl && ((t/400|0)%2);
    if(id===hl) R(ctx,x-2,y-2,12,12,blink?'#ffd0e6':'#ff8fbf');
    let col=(id===hl)?'#ffffff':'#8d6f9e';
    const m=ACTS.find(m=>m.id===id); if(m&&!inRoom(m)&&id!==hl) col='#dcc7e2';
    if(id==='room') col=ROOM_COL[st.room];
    bitmap(ctx,ICONS[id],x,y,col);
  });
  draw(TOP,2,8,24); draw(BOT,ROOM_Y+ROOM_H+2,12,30);
}

/* ================= character (옷은 몸, 표정은 머리 — 머리·몸 좌표가 같아서 갈아 끼움) ================= */
const clamp01=v=>v<0?0:v>1?1:v;
const sm=v=>{v=clamp01(v);return v*v*(3-2*v);};
const HY=ys=>sm((ys-100)/45)*(1-sm((ys-162)/30));      // 머리카락 흔들림 세기: 위(붙은 곳)는 고정, 아래로 갈수록 크게, 어깨 근처에서 다시 0
function warp(rx,ry,rw,rh,A,wxf){                         // 옆머리(금발 + 검은 가닥)만 가로로 살짝 휘어 흔들기 (고정 영역과는 부드럽게 이어짐)
  const src=cctx.getImageData(rx,ry,rw,rh), dst=cctx.createImageData(rw,rh), sd=src.data, dd=dst.data;
  for(let y=0;y<rh;y++){
    const hy=HY(ry+y);
    for(let x=0;x<rw;x++){
      const o=(y*rw+x)*4, d=A*hy*wxf(rx+x);
      if(Math.abs(d)<.03){dd[o]=sd[o];dd[o+1]=sd[o+1];dd[o+2]=sd[o+2];dd[o+3]=sd[o+3];continue;}
      const sx=x-d, x0=Math.floor(sx), f=sx-x0;
      const i0=Math.min(rw-1,Math.max(0,x0)), i1=Math.min(rw-1,Math.max(0,x0+1));
      const a0=sd[(y*rw+i0)*4+3]*(1-f), a1=sd[(y*rw+i1)*4+3]*f, a=a0+a1;
      if(a<1){dd[o+3]=0;continue;}
      for(let k=0;k<3;k++) dd[o+k]=(sd[(y*rw+i0)*4+k]*a0+sd[(y*rw+i1)*4+k]*a1)/a;
      dd[o+3]=a;
    }
  }
  cctx.putImageData(dst,rx,ry);
}
function composeKing(t){
  const sleeping=st.mode==='sleep';
  cctx.setTransform(1,0,0,1,0,0); cctx.clearRect(0,0,SW,SH);
  let head=null, sway=true;
  if(sleeping){ cctx.drawImage(imgs.sleeping,0,0); }               // 잘 때는 sleeping 그림 그대로 (옷 고정)
  else{
    cctx.drawImage(imgs[st.outfit==='uniform'?'base':'relax'],0,0);  // 선택한 옷 (제복 = base / 기본 = relax)
    if(st.mode==='eat'){ if(((t/260)|0)%2===0) head='eating'; }      // 입 오물오물: 먹는 입 ↔ 다문 입
    else if(st.mode==='listen'){ head='listening'; sway=false; }     // 헤드폰이 옆머리를 덮고 있어서 흔들지 않음
    else if(isSad()) head='sad';
    if(head){ cctx.clearRect(0,0,SW,HEAD_CUT); cctx.drawImage(imgs[head],0,0,SW,HEAD_CUT,0,0,SW,HEAD_CUT); }   // 얼굴만 표정 그림으로 교체
  }
  if(sway){
    const s=t/1000, sl=sleeping, per=sl?3.4:2.3, g=sl?.34:1;
    const aL=g*(6.5*Math.sin(s*2*Math.PI/per)+1.4*Math.sin(s*5.1));
    const aR=g*(6.0*Math.sin(s*2*Math.PI/per+.9)+1.2*Math.sin(s*4.3+1));
    warp(0,96,80,100,aL,xs=>clamp01((70-xs)/33));       // 왼쪽 옆머리
    warp(118,96,72,100,aR,xs=>clamp01((xs-140)/20));    // 오른쪽 옆머리
  }
}
function drawKing(t){
  composeKing(t);
  const by=st.mode==='listen'?Math.round(Math.abs(Math.sin(t/1000*Math.PI*2*1.2))):0;   // 음악 들을 땐 살짝 들썩
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(cc,0,0,SW,SH,Math.round(CHX+CROP_X*K),Math.round(CHY+CROP_Y*K)+by,SW*K*2,SH*K*2);
}
const P=(x,y)=>[CHX+x*K, CHY+y*K];

/* ================= effects ================= */
const ROSE=['.RRR.','RRdRR','RdRdR','.RRR.','..g..','.gg..','..g..'];
const ROSE_PAL={R:'#ff5a86',d:'#c2184f',g:'#4fae62'};
function fxRoses(t){   // 쓰다듬기: 작은 장미가 떠오름
  const spots=[[205,390],[540,370],[372,170]];
  spots.forEach(([sx,sy],i)=>{
    const ph=((t-st.modeT)/1000*.85+i/3)%1; const [x,y]=P(sx,sy);
    ctx.globalAlpha=ph<.7?1:1-(ph-.7)/.3;
    pbitmap(ctx,ROSE,ROSE_PAL,(x+Math.sin(ph*7+i)*2)|0,(y-ph*18)|0);
    ctx.globalAlpha=1;
  });
}
function fxSweat(t){   // 땀방울: 머리 주변에서 뚝뚝
  [[176,300,0],[540,292,.5],[170,352,.25],[548,344,.75],[186,250,.6]].forEach(([sx,sy,o])=>{
    const ph=((t/1000)*.55+o)%1; const [x,y]=P(sx,sy); const yy=y+ph*13; const a=ph<.8?1:1-(ph-.8)/.2;
    ctx.globalAlpha=a;
    bitmap(ctx,['.#.','###','###','.#.'],x|0,yy|0,'#8fd3ff');R(ctx,(x|0),(yy|0)+1,1,1,'#ffffff');
    ctx.globalAlpha=1;
  });
}
const NOTE1=['..##.','..#.#','..#..','..#..','###..','###..'], NOTE2=['.#####','.#...#','.#...#','.#...#','##..##','##..##'];
function fxNotes(t){   // 음표가 아바타 주변으로 떠오름
  const cols=['#7f6fe0','#ff7fb0','#3fa38c','#e0a03c','#7f6fe0'];
  [[36,60],[93,56],[44,40],[86,36],[30,38]].forEach(([nx,ny],i)=>{
    const ph=((t/1000)*.6+i/5)%1;
    ctx.globalAlpha=ph<.7?1:1-(ph-.7)/.3;
    bitmap(ctx,i%2?NOTE1:NOTE2,(nx+Math.sin(ph*9+i*2)*3)|0,(ny-ph*20)|0,cols[i]);
    ctx.globalAlpha=1;
  });
}
function fxZzz(t){
  const Z5=['#####','...#.','..#..','.#...','#####'], Z3=['###','.#.','###'];
  for(let i=0;i<3;i++){
    const ph=((t/1000)*.35+i/3)%1; const [x,y]=P(470,300);
    ctx.globalAlpha=ph<.75?1:1-(ph-.75)/.25;
    bitmap(ctx,ph>.45?Z5:Z3,(x+ph*12+Math.sin(ph*6)*2)|0,(y-ph*22)|0,'#6f7fe0');
    ctx.globalAlpha=1;
  }
}
function retro(){
  const id=ctx.getImageData(0,0,W,H), d=id.data, q=255/8;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    r=r*.9+20; g=g*.88+22; b=b*.86+30;
    const l=(r+g+b)/3; r=l+(r-l)*1.15; g=l+(g-l)*1.15; b=l+(b-l)*1.15;
    d[i]=Math.round(r/q)*q; d[i+1]=Math.round(g/q)*q; d[i+2]=Math.round(b/q)*q;
  }
  ctx.putImageData(id,0,0);
}

/* ================= menu / dialog ================= */
const clockEl=document.getElementById('clock'), menuEl=document.getElementById('menu'), dlgEl=document.getElementById('dialog'), dtext=document.getElementById('dtext');
function fmt(ms){
  ms=Math.max(0,ms); const sec=Math.floor(ms/1000), h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), ss=sec%60;
  const p2=n=>String(n).padStart(2,'0');
  return h?`${h}:${p2(m)}:${p2(ss)}`:`${m}:${p2(ss)}`;
}
function bar(ratio,col){
  const n=10, f=Math.ceil(Math.max(0,Math.min(1,ratio))*n-1e-9);
  return `<span class="bar">${('<i style="background:'+col+'"></i>').repeat(f)}${'<i></i>'.repeat(n-f)}</span>`;
}
function statusHTML(it){
  const sleeping=st.mode==='sleep';
  const row=(name,k,col,zero,okTxt)=>`<div class="srow"><span class="sn">${name}</span>${bar(lvl(k),col)}</div><div class="st">${lvl(k)<=0?zero:okTxt}</div>`;
  const left=k=>'남은 시간 '+fmt(remain(k));
  return `<div class="ttl"><span>♥ 상태</span><span>${PLACES[st.room]}</span></div>`+
    row('영감','insp','#b0456b','영감이 필요해… (와인 마시기)',left('insp'))+
    row('관심','care','#ff8fbf','관심이 필요해… (쓰다듬기)',left('care'))+
    row('건강','health','#7fd6a0','지쳤어… (잠자기)',sleeping?(st.slept30?'푹 자는 중 · 회복 완료':'자는 중 · 30초 이상 재워줘'):left('health'))+
    `<div class="sep"></div>`+it(0)+it(1);
}
function menuItems(){
  if(st.menu==='root') return ROOT;
  if(st.menu==='act')  return ACTS.filter(inRoom);
  if(st.menu==='move') return Object.keys(PLACES).filter(k=>k!==st.room).map(k=>({id:'go',to:k}));
  if(st.menu==='status') return [{id:'shop',label:'상점'},{id:'acc',label:'악세사리'}];
  if(st.menu==='shop'||st.menu==='acc') return [{id:'none',label:'아직 아무것도 없어',off:true}];
  return [];
}
function renderMenu(){
  _renderMenu();
  if(!st.menu) return;
  const sel=menuEl.querySelector('.it.sel'), ttl=menuEl.querySelector('.ttl');   // 선택 항목이 보이도록 스크롤
  if(!sel) return;
  const top=sel.offsetTop-(ttl?ttl.offsetHeight:0)-6, bot=sel.offsetTop+sel.offsetHeight+6-menuEl.clientHeight;
  if(menuEl.scrollTop>top) menuEl.scrollTop=Math.max(0,top); else if(menuEl.scrollTop<bot) menuEl.scrollTop=bot;
}
function _renderMenu(){
  if(!st.menu){menuEl.style.display='none';return;}
  const items=menuItems();
  if(st.menu==='status'){
    const it=i=>items[i]?`<div class="it ${i===st.cur?'sel':''}"><span class="cur">▶</span>${items[i].label}</div>`:'';
    menuEl.innerHTML=statusHTML(it);menuEl.style.display='block';return;}
  const title={root:'무엇을 할까?',act:'행동하기',move:'어디로 갈까?',shop:'상점',acc:'악세사리'}[st.menu];
  menuEl.innerHTML=`<div class="ttl"><span>♥ ${title}</span><span>${PLACES[st.room]}</span></div>`+items.map((m,i)=>{
    let label=m.label;
    if(m.id==='sleep'&&st.mode==='sleep') label='일어나기';
    if(m.id==='go') label=withRo(PLACES[m.to])+' 가기';
    return `<div class="it ${i===st.cur?'sel':''} ${m.off?'off':''}"><span class="cur">▶</span>${label}</div>`;
  }).join('');
  menuEl.style.display='block';
}
let typer=null;
function say(text,name='임금님'){
  clearInterval(typer);
  dlgEl.style.display='block';
  const nm=dlgEl.querySelector('.nm');nm.style.display=name?'block':'none';nm.textContent=name;
  dtext.textContent='';let i=0;st.dlg={done:false};
  typer=setInterval(()=>{dtext.textContent=text.slice(0,++i);if(i%2)beep(1200,.02,'square',.02);
    if(i>=text.length){clearInterval(typer);st.dlg.done=true;st.dlg.doneT=performance.now();}},55);
}
function hideDlg(){clearInterval(typer);dlgEl.style.display='none';st.dlg=null;}

/* ================= modes / actions ================= */
function setMode(m){
  st.mode=m; st.modeT=performance.now(); saveGame();
  if(m!=='talk') hideDlg();
  if(st.menu) renderMenu();
}
function closeMenu(){st.menu=null;renderMenu();}
function openSub(name){st.menu=name;st.cur=0;renderMenu();beep(990,.05);}
function endSleepSilent(){st.sleepAt=0;st.slept30=false;}
function startSleep(){st.sleepAt=Date.now();st.slept30=false;setMode('sleep');}
function wakeUp(){   // 30초 이상 잤으면 건강 가득 (자는 동안 이미 채워둠)
  const ok=st.slept30; endSleepSilent(); st.talkIcon='sleep'; setMode('talk'); say(ok?'푹 잤다. 개운하다!':'더 자고 싶다…');
}
function go(to){
  if(to===st.room||st.trans) return;
  if(st.mode==='sleep') endSleepSilent();
  setMode('idle'); st.transTo=to; st.trans=.01; beep(700,.06);
}
function runAct(id){
  beep(1320,.08);
  if(id==='sleep'){ if(st.mode==='sleep') wakeUp(); else startSleep(); return; }
  if(st.mode==='sleep') endSleepSilent();
  if(id==='wait'){ st.talkIcon='wait'; setMode('talk'); say(pick(WAIT_LINES)); }
  else if(id==='compose'){ st.listenKind='compose'; st.listenSaid=false; setMode('listen'); }
  else if(id==='juke'){ st.listenKind='juke'; st.listenSaid=false; setMode('listen'); }
  else if(id==='wine'){ setMode('eat'); }
}
function doAction(m){
  if(!m) return;
  if(st.menu==='root'){ if(ROOT_IDX[m.id]!==undefined) openSub(m.id); return; }
  if(st.menu==='act'){ closeMenu(); runAct(m.id); return; }
  if(st.menu==='move'){ if(m.id==='go'){ closeMenu(); go(m.to); } return; }
  if(st.menu==='status'){ if(m.id==='shop'||m.id==='acc') openSub(m.id); return; }
  beep(330,.04);
}

/* ================= main loop ================= */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  if(loaded<total){R(ctx,0,0,W,H,'#fff4f9');R(ctx,24,54,80*loaded/total,4,'#ff8fbf');return;}
  if(now-last<80) return; last=now; const t=now;
  const DN=Date.now();

  // ---- 시간 / 상태 ----
  if(st.mode==='sleep'){
    if(!st.sleepAt) st.sleepAt=DN;
    if(!st.slept30 && DN-st.sleepAt>=SLEEP_FULL){st.slept30=true;saveGame();}
    if(st.slept30) st.t.health=DN;                    // 30초 이상 잤으면 건강 가득
  }
  const gm=gameMin(); clockEl.textContent=(isNight()?'🌙 ':'☀ ')+String(Math.floor(gm/60)).padStart(2,'0')+':'+String(Math.floor(gm%60)).padStart(2,'0');

  // ---- 행동 진행 ----
  const el=t-st.modeT;
  if(st.mode==='eat' && el>DRINK_MS){                  // 와인: 다 마시면 영감 가득
    st.t.insp=DN; saveGame(); st.talkIcon='wine'; setMode('talk'); say('…좋은 와인이다. 영감이 샘솟는다!');
  }else if(st.mode==='listen'){
    if(!st.listenSaid && el>LISTEN_MS){
      st.listenSaid=true;
      if(st.listenKind==='compose'){const s=pick(SONGS);say(`'${s.t}'${josa(s.r||s.t,'을','를')} 작곡했다!`);}
      else{const a=pick(ALBUMS);say(`오늘은 '${a.t}'${josa(a.r||a.t,'이','가')} 좋겠다.`);}
    }else if(st.listenSaid && st.dlg && st.dlg.done && t-st.dlg.doneT>3500) setMode('idle');
  }
  else if(st.mode==='pet' && el>1800) setMode('idle');
  else if(st.mode==='talk' && st.dlg && st.dlg.done && t-st.dlg.doneT>3500) setMode('idle');
  if(st.menu==='status' && (t/500|0)!==st._sTick){st._sTick=t/500|0; renderMenu();}

  // ---- 그리기 ----
  ctx.imageSmoothingEnabled=false;
  const night=isNight();
  ctx.drawImage(bg(st.room,st.mode!=='sleep',night),0,ROOM_Y);
  if(night){ctx.fillStyle=NIGHT_DIM;ctx.fillRect(0,ROOM_Y,W,ROOM_H);}   // 밤: 배경만 어둡게 (캐릭터는 원래 밝기)
  ctx.save();ctx.beginPath();ctx.rect(0,ROOM_Y,W,ROOM_H);ctx.clip();
  drawKing(t);
  const sadNow=isSad() && !['sleep','eat','listen'].includes(st.mode);
  if(sadNow) fxSweat(t);
  if(st.mode==='pet') fxRoses(t);
  if(st.mode==='listen') fxNotes(t);
  if(st.mode==='sleep'){ctx.fillStyle='rgba(30,26,80,.42)';ctx.fillRect(0,ROOM_Y,W,ROOM_H);fxZzz(t);}
  if(st.trans>0){
    const q=st.trans, h=Math.round(ROOM_H/2*(q<.5?q*2:(1-q)*2));
    R(ctx,0,ROOM_Y,W,h,'#3b2a46');R(ctx,0,ROOM_Y+ROOM_H-h,W,h,'#3b2a46');
    st.trans+=.12; if(st.trans>=.5&&st.transTo){st.room=st.transTo;st.transTo=null;saveGame();}
    if(st.trans>=1) st.trans=0;
  }
  ctx.restore();
  drawBars(t);
  if(night){ctx.fillStyle=NIGHT_DIM;ctx.fillRect(0,0,W,ROOM_Y);ctx.fillRect(0,ROOM_Y+ROOM_H,W,H-ROOM_Y-ROOM_H);}
  retro();
  gctx.clearRect(0,0,W,H);gctx.drawImage(lcd,0,0);
}

/* ================= buttons (왼쪽: 관심 · 가운데: 기능 · 오른쪽: 항목 내리기) ================= */
function btnLeft(){
  if(st.trans) return;
  if(st.menu){
    const M=st.menu;
    if(M==='shop'||M==='acc'){st.menu='status';st.cur=M==='shop'?0:1;}
    else if(M==='act'||M==='move'||M==='status'){st.menu='root';st.cur=ROOT_IDX[M];}
    else st.menu=null;
    renderMenu();beep(520,.06);return;
  }
  if(st.mode==='sleep'){wakeUp();beep(520,.06);return;}
  if(st.mode!=='idle'&&st.mode!=='pet'){setMode('idle');beep(520,.06);return;}   // 기능 해제
  st.t.care=Date.now(); saveGame();                                                // 관심 주기: 가득 참
  setMode('pet');beep(1500,.05,'triangle',.08);setTimeout(()=>beep(1900,.07,'triangle',.08),70);
}
function btnMid(){
  if(st.trans) return;
  if(!st.menu){st.menu='root';st.cur=0;renderMenu();beep(990,.06);return;}
  doAction(menuItems()[st.cur]);
}
function btnRight(){
  if(st.trans) return;
  if(st.menu){st.cur=(st.cur+1)%menuItems().length;renderMenu();beep(880,.04);return;}
  beep(660,.03);
}
function bind(id,fn){const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}el.classList.add('down');fn();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('down')));
  el.addEventListener('contextmenu',e=>e.preventDefault());}
bind('bA',btnLeft);bind('bB',btnMid);bind('bC',btnRight);
document.addEventListener('keydown',e=>{if(e.target&&e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft')btnLeft(); if(k==='s'||k==='enter'||k==='arrowup')btnMid(); if(k==='d'||k==='arrowdown'||k==='arrowright')btnRight();});

/* ================= save / load ================= */
const SAVE_KEY='kinggotchi:v1';
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({room:st.room,outfit:st.outfit,theme:st.theme,bg:st.bg,t:st.t,sleepAt:st.sleepAt,slept30:st.slept30,sleeping:st.mode==='sleep'}));
  }catch(e){}
}
function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(!d) return;
    for(const k of ['room','outfit','theme','bg','sleepAt','slept30']) if(d[k]!==undefined) st[k]=d[k];
    if(!PLACES[st.room]) st.room='hall';
    if(!['basic','uniform'].includes(st.outfit)) st.outfit='basic';
    if(!SHELL[st.theme]) st.theme='1';
    const n=Date.now();

function jaggedRect(c,x,y,w,h,step,amp,mode,seed){

  for(let t=0;t<w;t+=step) push(x+t,y,0,-1);

  for(let t=0;t<h;t+=step) push(x,y+h-t,-1,0);
  c.beginPath(); pts.forEach((p,j)=>j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath();

  else btnsDraw(c,'#ffe3f0','#f3a6c8',false);
  // dial (all themes)
  const DIAL={'1':['#9eebd2','#52b896','#f7a9cf'],'2':['#74d07e','#4fae62','#ff9fd0'],'3':['rgba(52,46,70,.95)','#0f0b18','#b48cff'],'4':['#e8e4f8','#a9b6ee','#ffd36b'],'5':['rgba(246,236,255,.95)','#d8c6f0','#ff9fcf']}[theme];
  c.beginPath();c.arc(336,100,20.5,0,7);c.fillStyle=DIAL[0];c.fill();c.strokeStyle=DIAL[1];c.lineWidth=3;c.stroke();
  c.beginPath();c.arc(336,100,8.5,0,7);c.fillStyle=DIAL[2];c.fill();c.stroke();
}
const shellCv=document.getElementById('shell');
function renderShell(){
  const dpr=Math.min(3,window.devicePixelRatio||1); shellCv.width=390*dpr; shellCv.height=520*dpr;
  const c=shellCv.getContext('2d'); c.setTransform(dpr,0,0,dpr,20*dpr,25*dpr); c.clearRect(-20,-25,390,520);
  drawShell(c,st.theme,false);
  shellCv.style.setProperty('--glow',SHELL[st.theme].glow);
  document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===st.theme));
}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{st.theme=b.dataset.theme;renderShell();saveGame();});
function fitEgg(){
  const s=Math.min(1,(window.innerWidth-8)/390), h=document.getElementById('eggHolder');
  h.style.width=390*s+'px'; h.style.height=520*s+'px'; document.getElementById('eggScale').style.transform=`scale(${s})`;
}
window.addEventListener('resize',fitEgg);

/* ================= capture ================= */
function eggPath(c,x,y,w,h){
  const tl=[w*.5,h*.57], br=[w*.47,h*.43];
  c.beginPath();
  c.moveTo(x+tl[0],y);
  c.ellipse(x+w-tl[0],y+tl[1],tl[0],tl[1],0,-Math.PI/2,0);
  c.lineTo(x+w,y+h-br[1]);
  c.ellipse(x+w-br[0],y+h-br[1],br[0],br[1],0,0,Math.PI/2);
  c.lineTo(x+br[0],y+h);
  c.ellipse(x+br[0],y+h-br[1],br[0],br[1],0,Math.PI/2,Math.PI);
  c.lineTo(x,y+tl[1]);
  c.ellipse(x+tl[0],y+tl[1],tl[0],tl[1],0,Math.PI,Math.PI*1.5);
  c.closePath();
}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);}
function drawPageBg(c,S){
  if(st.bg.type==='custom'&&customBgURL){
    const im=customBgImg; if(im){const k=Math.max(S/im.width,S/im.height);c.drawImage(im,(S-im.width*k)/2,(S-im.height*k)/2,im.width*k,im.height*k);return;}
  }
  if(st.bg.type==='preset'&&st.bg.i>0){const src=pageBgCanvas(st.bg.i);c.imageSmoothingEnabled=false;const k=S/90;c.drawImage(src,0,(160*k-S)/-2,S,160*k);c.imageSmoothingEnabled=true;return;}
  const g=c.createLinearGradient(0,0,S,S);g.addColorStop(0,'#ffeaf4');g.addColorStop(.6,'#e9e4ff');g.addColorStop(1,'#dff8f0');c.fillStyle=g;c.fillRect(0,0,S,S);
  c.fillStyle='rgba(255,255,255,.75)';const G=30*2.6;for(let y=G/2;y<S;y+=G)for(let x=G/2;x<S;x+=G){c.beginPath();c.arc(x,y,5,0,7);c.fill();}   // 일정한 간격 도트
}
function capture(){
  const S=1080, cv=document.createElement('canvas'); cv.width=cv.height=S; const c=cv.getContext('2d');
  drawPageBg(c,S);
  const k=S*.82/500, ox=(S-350*k)/2, oy=(S-470*k)/2+8*k;
  c.save(); c.setTransform(k,0,0,k,ox,oy);
  drawShell(c,st.theme,true);
  drawLCDInto(c);
  c.restore();
  return cv;
}
function drawLCDInto(c){
  c.save(); rr(c,47,110,256,224,6); c.clip();
  c.imageSmoothingEnabled=false; c.drawImage(lcd,47,110,256,224);
  c.globalAlpha=.32; c.globalCompositeOperation='screen'; c.filter='blur(3px) brightness(1.1) saturate(1.2)'; c.imageSmoothingEnabled=true; c.drawImage(lcd,47,110,256,224);
  c.filter='none'; c.globalAlpha=1; c.globalCompositeOperation='source-over';
  c.fillStyle='rgba(255,255,255,.05)'; for(let y=110;y<334;y+=2) c.fillRect(47,y,256,1);
  c.restore();
}
const capModal=document.getElementById('capModal'), capImg=document.getElementById('capImg');
let capCanvas=null;
document.getElementById('capbtn').onclick=()=>{
  const go=()=>{capCanvas=capture();capImg.src=capCanvas.toDataURL('image/png');capModal.classList.add('show');beep(1600,.05);setTimeout(()=>beep(2000,.08),60);};
  if(st.bg.type==='custom'&&customBgURL&&!customBgImg){customBgImg=new Image();customBgImg.onload=go;customBgImg.src=customBgURL;} else go();
};
document.getElementById('capClose').onclick=()=>capModal.classList.remove('show');
document.getElementById('capSave').onclick=()=>{
  capCanvas.toBlob(async blob=>{
    const name='kinggotchi_'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.png';
    const file=new File([blob],name,{type:'image/png'});
    const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isIOS && navigator.canShare && navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
};
[bgModal,capModal].forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));


/* ================= init ================= */
loadGame(); applyBg(); applyOutfit(); renderShell(); fitEgg();
requestAnimationFrame(frame);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
